[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "uniden-p2-updater"
version = "0.2.0"
description = "Unofficial native Python updater for pinned Uniden BCD996P2 firmware"
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "COPYRIGHT", "THIRD_PARTY_NOTICES.md"]
authors = [{ name = "uniden-p2-updater contributors" }]
dependencies = ["pyserial>=3.5,<4"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Topic :: System :: Hardware",
]

[project.urls]
Repository = "https://github.com/RCGV1/uniden-p2-updater"
Issues = "https://github.com/RCGV1/uniden-p2-updater/issues"

[project.scripts]
uniden-p2-update = "uniden_p2_updater.cli:main"
uniden-p2-backup = "uniden_p2_updater.backup:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
